services:
  api:
    build: .
    env_file:
      - .env
    environment:
      RKB_DATA_DIR: /app/data
      RKB_EMBEDDING_MODEL: /models/bge-small-zh-v1.5
      RKB_ALLOW_MODEL_DOWNLOAD: "false"
    ports:
      - "8000:8000"
    volumes:
      - rkb-data:/app/data
      - ${MODEL_DIR:-D:/langchain01/models}:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  ui:
    build: .
    env_file:
      - .env
    environment:
      RKB_DATA_DIR: /app/data
      RKB_API_URL: http://api:8000
      RKB_EMBEDDING_MODEL: /models/bge-small-zh-v1.5
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rkb-data:

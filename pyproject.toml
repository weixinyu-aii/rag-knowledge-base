[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rag-knowledge-base"
version = "0.1.0"
description = "A production-oriented hybrid RAG knowledge base with citations and evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RAG Knowledge Base contributors" }]
keywords = ["rag", "retrieval", "faiss", "bm25", "llm", "knowledge-base"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
rag = [
  "numpy>=1.26,<3",
  "faiss-cpu>=1.8,<2",
  "sentence-transformers>=2.7,<7",
  "torch>=2.2",
  "pypdf>=4.2,<7",
  "python-docx>=1.1,<2",
  "dashscope>=1.20,<2",
]
api = [
  "fastapi>=0.111,<2",
  "uvicorn[standard]>=0.30,<2",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
]
ui = ["streamlit>=1.36,<2", "httpx>=0.27,<1"]
dev = [
  "httpx>=0.27,<1",
  "ruff>=0.5,<1",
]
all = [
  "numpy>=1.26,<3",
  "faiss-cpu>=1.8,<2",
  "sentence-transformers>=2.7,<7",
  "torch>=2.2",
  "pypdf>=4.2,<7",
  "python-docx>=1.1,<2",
  "dashscope>=1.20,<2",
  "fastapi>=0.111,<2",
  "uvicorn[standard]>=0.30,<2",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "streamlit>=1.36,<2",
  "ruff>=0.5,<1",
]

[project.scripts]
rkb = "rag_knowledge_base.cli:main"

[project.urls]
Repository = "https://github.com/OWNER/REPOSITORY"
Issues = "https://github.com/OWNER/REPOSITORY/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_knowledge_base"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
